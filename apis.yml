name: Medallion
description: >-
  Medallion is an AI-powered healthcare operations platform for provider
  credentialing, enrollment, and licensing, operated by FirstLayerAI, Inc. It
  positions itself as the AI operations partner powering healthcare's first
  real-time CVO (Credentialing Verification Organization), NCQA-certified, and
  serves provider groups, payers, health systems, RCM organizations, and digital
  health companies. Capabilities span provider data management, delegated
  credentialing, roster management, privileging, cross-state licensing, ongoing
  credential monitoring, and CredAlliance, its proprietary payer clearinghouse.
  Medallion is SOC 2 compliant and publishes a Trust Center. As of this profile
  there is no public developer API surface; enrichment captured the company's
  identity, compliance posture, and domain security.
